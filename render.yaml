services:
  # ── 1. Backend Web Service (Node.js + WebSockets) ─────────────────
  - type: web
    name: gmgn-bot-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: POLL_INTERVAL_MS
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: gmgn-bot-postgres
          property: connectionString
      - key: GMGN_API_KEY
        sync: false # Set securely in Render dashboard
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: SESSION_ENCRYPTION_SECRET
        generateValue: true # Render automatically generates a cryptographically secure 32+ char key
      - key: FRONTEND_URL
        fromService:
          type: web
          name: gmgn-bot-frontend
          property: host

  # ── 2. Frontend Static Site (React + Vite) ────────────────────────
  - type: web
    name: gmgn-bot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: gmgn-bot-backend
          property: host

databases:
  # ── 3. Managed PostgreSQL Database ────────────────────────────────
  - name: gmgn-bot-postgres
    plan: free
